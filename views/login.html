<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar – Amigo Havaiana</title>
<style>
  :root{--bg1:#1c1c1e;--bg2:#0a0a0a;--card:#fff;--ink:#0a0a0a;--muted:#8e8e93;--line:#e4e4e7;--field:#f2f2f4;--accent:#0a0a0a;--accent2:#3a3a3c;--errbg:#fff0f0}
  
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:radial-gradient(circle at 20% 15%,var(--bg1),transparent 55%),radial-gradient(circle at 85% 90%,var(--bg2),transparent 55%),var(--bg1);overflow-x:hidden}
  .float{position:fixed;font-size:42px;opacity:.18;pointer-events:none;animation:drift 9s ease-in-out infinite}
  .f1{top:8%;left:7%}.f2{top:70%;left:10%;animation-delay:-3s;font-size:34px}.f3{top:14%;right:9%;animation-delay:-5s;font-size:30px}.f4{bottom:9%;right:12%;animation-delay:-1.5s}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}
  .card{position:relative;width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px 28px;
    box-shadow:0 20px 50px -18px rgba(0,0,0,.7);text-align:center}
  .logo{width:84px;height:84px;margin:-76px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:44px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 10px 24px -8px rgba(0,0,0,.5);border:5px solid var(--card)}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}
  label{display:block;text-align:left;font-weight:600;font-size:14px;margin-bottom:8px}
  .field{position:relative}
  input{width:100%;font:inherit;font-size:16px;padding:14px 48px 14px 44px;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,10,10,.1)}
  .lock{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:18px;cursor:pointer;padding:8px;border-radius:8px;color:var(--muted)}
  .eye:hover{background:var(--line)}
  .btn{width:100%;margin-top:18px;font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:14px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 8px 18px -8px rgba(0,0,0,.5);transition:transform .1s,filter .15s}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.98)} .btn:disabled{opacity:.6;cursor:wait}
  .err{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--errbg);color:#b3261e;font-size:14px;font-weight:600}
  .err.show{display:block}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .back{display:inline-block;margin-top:20px;color:var(--muted);font-size:13px;text-decoration:none}
  .back:hover{color:var(--accent)}
</style>
</head>
<body>
<span class="float f1">🩴</span><span class="float f2">🎁</span><span class="float f3">🎄</span><span class="float f4">🩴</span>

<form class="card" id="f">
  <div class="logo">🩴</div>
  <h1>Área do Organizador</h1>
  <p class="sub">Amigo Havaiana</p>

  <label for="senha">Senha</label>
  <div class="field">
    <span class="lock">🔒</span>
    <input id="senha" type="password" autocomplete="current-password" required autofocus placeholder="Digite a senha">
    <button type="button" class="eye" id="eye" title="Mostrar senha" aria-label="Mostrar senha">👁️</button>
  </div>

  <button class="btn" id="btn">Entrar</button>
  <div class="err" id="err"></div>
  <a class="back" href="/">← Voltar para a inscrição</a>
</form>

<script>
const $ = id => document.getElementById(id);
$("eye").onclick = () => {
  const show = $("senha").type === "password";
  $("senha").type = show ? "text" : "password";
  $("eye").textContent = show ? "🙈" : "👁️";
  $("senha").focus();
};
$("f").onsubmit = async (e) => {
  e.preventDefault();
  $("btn").disabled = true; $("btn").textContent = "Entrando…"; $("err").classList.remove("show");
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ senha: $("senha").value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { $("btn").textContent = "✓ Bem-vindo!"; location.href = "/admin"; return; }
    throw new Error(j.erro || "Não foi possível entrar.");
  } catch (err) {
    $("err").textContent = err.message; $("err").classList.add("show");
    $("f").classList.remove("shake"); void $("f").offsetWidth; $("f").classList.add("shake");
    $("senha").select();
  }
  $("btn").disabled = false; $("btn").textContent = "Entrar";
};
</script>
</body>
</html>
